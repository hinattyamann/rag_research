[project]
name = "rag-research"
version = "0.1.0"
description = "Evaluation-driven self-controlled RAG research project"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "bm25s>=0.3.12",
    "huggingface-hub>=1.33.0",
    "langgraph>=1.2.13",
    "numpy>=2.5.3",
    "onnxruntime>=1.30.0",
    "psutil>=7.2.2",
    "pyyaml>=6.0.3",
    "tokenizers>=0.23.2",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=8.0",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

